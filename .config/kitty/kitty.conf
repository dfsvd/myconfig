# 字体设置
font_family    Maple Mono NF CN
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12

# 设置备用字体 (将中文字符和符号改为霞鹜文楷等宽)
# U+4E00-U+9FFF 等：中文汉字基本及扩展区
symbol_map U+4E00-U+9FFF LXGW WenKai Mono
symbol_map U+3400-U+4DBF LXGW WenKai Mono
symbol_map U+20000-U+2A6DF LXGW WenKai Mono
symbol_map U+2A700-U+2B73F LXGW WenKai Mono
symbol_map U+2B740-U+2B81F LXGW WenKai Mono
symbol_map U+2B820-U+2CEAF LXGW WenKai Mono
# 额外添加中文标点符号范围
symbol_map U+3000-U+33FF LXGW WenKai Mono
symbol_map U+FE30-U+FE4F LXGW WenKai Mono
symbol_map U+FF00-U+FFEF LXGW WenKai Mono

# 自动隐藏鼠标
mouse_hide_wait 3.0

# 鼠标右键粘贴
detect_urls no
copy_on_select clipboard
strip_trailing_spaces smart
select_by_word_characters ${}/&@_.
focus_follows_mouse yes
mouse_map right press grabbed,ungrabbed no-op
mouse_map right click grabbed,ungrabbed paste_from_clipboard
allow_hyperlinks no

# 关闭确认关闭窗口
confirm_os_window_close 0

# 窗口配置
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# 光标配置
cursor_shape block
cursor_blink_interval 1

# 回滚缓冲区
scrollback_lines 3000

# 常用快捷键
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# 标签栏配置
tab_bar_style powerline
tab_bar_align left

# Shell 集成
shell_integration enabled

# 指定shell为zsh
shell zsh

# Dank 配色方案
include dank-tabs.conf
include dank-theme.conf
